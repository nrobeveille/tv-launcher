name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk

      - name: Publier le log de compilation (en cas d'échec)
        if: failure()
        shell: bash
        run: |
          set +e
          touch build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan ci-logs
          git rm -r -q --cached .
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -q -m "Log de compilation ${GITHUB_SHA::7}"
          git push -f -q origin HEAD:ci-logs
          exit 0

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-launcher.apk

      - name: Publier la release « latest »
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-launcher.apk \
            --title "Dernière version" \
            --notes "APK compilé automatiquement depuis ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
