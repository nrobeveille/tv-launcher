name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk

      - name: Résumer les erreurs de compilation
        if: failure()
        run: |
          # Regroupe les erreurs dans une annotation (lisible sans télécharger les logs).
          ERRORS=$(grep -E "^e: |What went wrong|^> |Could not|error:|Unresolved|FAILED" build.log | head -n 60 || true)
          ERRORS="${ERRORS//'%'/'%25'}"
          ERRORS="${ERRORS//$'\r'/'%0D'}"
          ERRORS="${ERRORS//$'\n'/'%0A'}"
          echo "::error title=Erreurs de compilation::${ERRORS:-Aucune ligne d'erreur reconnue}"

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-launcher.apk

      - name: Publier la release « latest »
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-launcher.apk \
            --title "Dernière version" \
            --notes "APK compilé automatiquement depuis ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
