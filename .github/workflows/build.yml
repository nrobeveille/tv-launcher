name: Build APK

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Le numéro de build sert de versionCode : chaque version publiée est plus récente que la précédente.
  VERSION_CODE: ${{ github.run_number }}
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "true" ]; then
            # Sans clé stable, l'APK ne pourrait pas mettre à jour l'appli installée.
            echo "::error title=Clé de signature manquante::Ajoute les secrets SIGNING_KEYSTORE_BASE64 et SIGNING_PASSWORD (voir README)."
            exit 1
          fi

      - name: Compiler l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk tv-launcher.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: tv-launcher.apk

      - name: Publier la release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${VERSION_CODE}"
          # Ancienne release unique « latest » (avant le système de mise à jour).
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" tv-launcher.apk \
            --title "Launcher TV $TAG" \
            --notes "Compilé automatiquement depuis ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest
          # On ne garde que les 5 dernières versions.
          gh release list --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag

      - name: Publier le log de compilation (en cas d'échec)
        if: failure()
        shell: bash
        run: |
          set +e
          touch build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan ci-logs
          git rm -r -q --cached .
          cp /tmp/build.log build.log
          git add -f build.log
          git commit -q -m "Log de compilation ${GITHUB_SHA::7}"
          git push -f -q origin HEAD:ci-logs
          exit 0
